# Проект dbt: из сырого слоя в витрины.
#
# Четырнадцать моделей в трех слоях, снимок витрины продаж и девяносто с лишним
# проверок. Что где лежит - в DICTIONARY.md, почему так решено - в README.
#
# Две вещи, которые стоит знать до чтения моделей.
#
# Витрина продаж инкрементальная и пересобирает окно назад, потому что возврат
# приезжает позже покупки и меняет выручку прошлого. У витрины конверсии окна
# нет вовсе: ни трафик, ни заказы задним числом не переписываются. Окно - это
# свойство конкретной витрины, а не общая настройка пайплайна.
#
# Проверки живут в двух местах: штатные - ключом data_tests в yml рядом с
# колонкой, свои - отдельными запросами в tests/. Разделение "стоп против
# флага" описано в README; здесь важно, что флаги - это не тесты, а модель
# mart_store_daily_quality.

name: retail_pipeline
version: 1.0.0
config-version: 2

profile: retail_pipeline

# Несовпадение версии должно падать сразу и понятно, а не проявляться странным
# поведением через полчаса. Почему именно 1.12 - в requirements-dbt.txt.
require-dbt-version: [">=1.12.0", "<1.13.0"]

flags:
  # Один сетевой вызов на каждый прогон, которого проверяющий не просил.
  send_anonymous_usage_stats: false

vars:
  # Окно пересчета: на сколько дней назад ежедневный прогон пересобирает
  # витрину продаж. Число живет здесь одно на весь проект - его читают и
  # витрина, и флаг "возврат вне окна", и DAG его не переопределяет.
  #
  # 28 дней - это 99-й перцентиль наблюдаемой задержки возврата. Замер по
  # 136 116 возвратам: медиана 2 дня, 95-й перцентиль 19, 99-й 28, максимум 30.
  # Позже 28 дней приезжает 0,78% возвратов на 2,6 млн рублей - 0,72% всех
  # возвратов и 0,025% выручки брутто. Для сравнения: окно в 21 день оставляет
  # снаружи 3,47% на 12,6 млн, окно в 14 дней - 10,5% на 38,5 млн.
  #
  # Почему не 30, хотя максимум в данных ровно 30. Взять наблюдаемый максимум
  # значит подогнать окно под выборку и сделать вид, что хвост ограничен. Он не
  # ограничен: следующий возврат может приехать на 31-й день, и окно, равное
  # максимуму, об этом промолчит. На 28 днях остаток ловит флаг
  # return_outside_window, и расширять окно можно по его показаниям, а не по
  # квартальной сверке.
  return_window_days: 28

  # Глубина сверки собранного чека с сырьем в ежедневном прогоне.
  reconcile_days: 30

models:
  retail_pipeline:
    # Материализация по умолчанию задается папкой: view там, где только
    # переименование и приведение типов, table там, где джойн и оконная
    # сортировка, которые иначе выполнялись бы заново при каждом обращении.
    #
    # Отступают от умолчания четыре модели, и у каждой отступление куплено
    # замером, а не вкусом:
    #
    #   int_order_lines             incremental - см. QUERY-PLAN.md, там замер
    #   mart_store_daily_sales      incremental, окно 28 дней назад
    #   mart_store_daily_conversion incremental, ровно целевая дата
    #   mart_store_daily_revisions  view - это отчет поверх снимка, не витрина
    #
    # Правило поэтому звучит так: папка задает умолчание, модель отступает от
    # него только там, где может показать, что отступление окупается.
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
