# Проект dbt: из сырого слоя в витрины.
#
# Инкрементальность, unique_key и окно пересчета - этап 4. Здесь витрины
# собираются целиком, и это не упущение: пока нет ни расписания, ни пересчета
# за дату, инкрементальная модель была бы конструкцией без задачи.
#
# Тестов на этом этапе тоже нет - они этап 3. Их отсутствие видно по пустому
# ключу tests во всех yml, и так и задумано.

name: retail_pipeline
version: 1.0.0
config-version: 2

profile: retail_pipeline

# Несовпадение версии должно падать сразу и понятно, а не проявляться странным
# поведением через полчаса. Почему именно 1.12 - в requirements-dbt.txt.
require-dbt-version: [">=1.12.0", "<1.13.0"]

flags:
  # Один сетевой вызов на каждый прогон, которого проверяющий не просил.
  send_anonymous_usage_stats: false

models:
  retail_pipeline:
    # Материализация задается папкой, а не моделью. Правило одно: view там, где
    # только типы и имена, table там, где джойн и сортировка, которые иначе
    # выполнялись бы заново на каждый запрос и на каждый тест этапа 3.
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
