version: 2

# A snapshot of the sales mart after every run — the foundation of the revision
# log.
#
# Why it is needed. The mart is incremental: reprocessing the window rewrites
# rows for past days, and the previous value disappears without a trace. Yet the
# whole project rests on the promise that yesterday's number does not change
# silently — so what it used to be has to survive somewhere. The snapshot is
# that somewhere.
#
# Strategy check, not timestamp: the mart has no modification-time column, and
# it does not need one — it is the values that have to be compared. Listed here
# are exactly the four the log exists for; a change to the has_orders flag or to
# the line count does not count as a revision.
#
# The snapshot is taken AFTER the build, not before. The difference matters: it
# records the result rather than the intention, and the next version appears
# only once a published number has actually moved.

snapshots:
  - name: snap_store_daily_sales
    relation: ref('mart_store_daily_sales')
    description: >
      The history of published values of the sales mart. A service table living
      in the ops schema; there is no need to read it by hand — that is what
      marts.mart_store_daily_revisions is for.
    config:
      schema: ops
      unique_key: [store_id, order_date]
      strategy: check
      check_cols: [orders_count, revenue_gross, returns_amount, revenue_net]
    columns:
      - name: store_id
        description: The store. Part of the snapshot key.
      - name: order_date
        description: The day of purchase. Part of the snapshot key.
      - name: has_orders
        description: Whether orders arrived for this day. Changes to it are not tracked.
      - name: orders_count
        description: Orders excluding cancelled ones. One of the four tracked quantities.
      - name: orders_cancelled_count
        description: Cancelled orders. Changes to it are not tracked.
      - name: lines_count
        description: Order lines after deduplication. Changes to it are not tracked.
      - name: units_sold
        description: Units sold. Changes to it are not tracked.
      - name: revenue_gross
        description: Gross revenue. One of the four tracked quantities.
      - name: returns_amount
        description: >
          Returns attributed to the order date. One of the four tracked
          quantities, and usually the only one that moves.
      - name: returns_arrived_amount
        description: Returns by the date they arrived. Changes to it are not tracked.
      - name: revenue_net
        description: Net revenue. One of the four tracked quantities.
      - name: dbt_scd_id
        description: A service identifier for the version, set by dbt.
      - name: dbt_updated_at
        description: A service timestamp for the version, set by dbt.
      - name: dbt_valid_from
        description: >
          The moment from which the version is in force. This is what becomes
          the recomputation date in the revision log.
      - name: dbt_valid_to
        description: >
          The moment up to which the version was in force. Empty for the current
          version — the one now sitting in the mart.
