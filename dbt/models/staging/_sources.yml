version: 2

sources:
  - name: raw
    schema: raw
    description: >
      Сырой слой - выгрузка источника как она есть, вместе с дефектами.
      Первичных ключей и ограничений уникальности здесь нет намеренно:
      среди заложенных дефектов есть дубли строк, и ограничение сделало бы
      дефект незагружаемым. Подробности - в db/schema/01_raw.sql.

    # Свежести источника здесь нет, и это не пропуск. Штатный dbt source
    # freshness смотрит на колонку времени загрузки, а ее в сыром слое нет:
    # источник отдает бизнес-даты, а не отметку о том, когда строка приехала.
    # Проверка свежести живет своим тестом - tests/assert_source_is_fresh.sql.

    tables:
      - name: stores
        description: Справочник магазинов. Единственная таблица без партиций, перегружается целиком.
        columns:
          - name: store_id
            description: Идентификатор магазина. Сквозной по всему проекту.
          - name: store_code
            description: Код точки в виде S0001. Витринами не используется, живет для читаемости.
          - name: city
            description: Город. Один из тридцати, справочный атрибут.
          - name: store_format
            description: Формат точки - малый, средний или большой. Определяет базовый поток заказов.
          - name: opened_on
            description: >
              Дата открытия. До нее у магазина нет ни заказов, ни трафика, и на
              ней стоит зерно обеих витрин: 12 магазинов из 120 открылись внутри
              горизонта, и их пустые дни - не пропущенные данные.

      - name: orders
        description: Заказы. Партиция по order_date. Статус проставлен уже в источнике.
        columns:
          - name: order_id
            description: >
              Идентификатор заказа. Кодирует дату и магазин, поэтому по нему
              однозначно восстанавливается партиция, а возврат связывается с
              заказом без обращения к таблице заказов.
          - name: store_id
            description: Магазин, оформивший заказ.
          - name: order_ts
            description: Отметка времени заказа, час от 9 до 21. Витринами не используется - зерно дневное.
          - name: order_date
            description: Дата заказа. Ключ партиции.
          - name: channel
            description: >
              Канал - офлайн, сайт или приложение. К дверному счетчику относится
              только офлайн, и из-за этого канал участвует в расчете конверсии.
          - name: status
            description: >
              Оформлен или отменен. Статус финален уже в источнике: отмена
              никогда не меняет вчерашнее число.
          - name: customer_id
            description: >
              Идентификатор покупателя, заполнен у 70% заказов. Оставлен как
              задел под когорты; ни одна текущая витрина его не использует.

      - name: order_items
        description: Позиции заказа. Партиция по order_date. Здесь лежат дубли выгрузки и выбросы.
        columns:
          - name: order_id
            description: Заказ, к которому относится позиция.
          - name: order_date
            description: >
              Дата заказа, денормализована намеренно: без нее удаление партиции
              пришлось бы делать джойном к заказам.
          - name: line_no
            description: Номер позиции внутри заказа. Вместе с order_id образует зерно.
          - name: sku
            description: >
              Непрозрачный код позиции. Ни категории, ни бренда, ни закупочной
              цены здесь нет и не будет - это категорийный менеджмент, другая
              профессия.
          - name: quantity
            description: Количество. Ноль встречается - это заложенный выброс.
          - name: unit_price
            description: Цена за единицу, от 199 до 19990.
          - name: line_amount
            description: >
              Сумма позиции. Может быть отрицательной - это тоже заложенный
              выброс, и он намеренно доезжает до витрины.

      - name: returns
        description: >
          Возвраты. Партиция по returned_date, а не по дате заказа: возврат
          приезжает своим днем и меняет выручку прошлого.
        columns:
          - name: return_id
            description: Идентификатор возврата, выводится из идентификатора заказа.
          - name: order_id
            description: Заказ, к которому относится возврат.
          - name: order_date
            description: Дата исходного заказа. К ней возврат относится в витрине продаж.
          - name: line_no
            description: Позиция заказа, которую вернули.
          - name: returned_date
            description: >
              Дата приезда возврата. Ключ партиции. Отстает от даты заказа на
              0-30 дней, медиана 2 дня.
          - name: quantity
            description: Возвращенное количество, не больше купленного.
          - name: returned_amount
            description: Сумма возврата - цена за единицу на возвращенное количество.

      - name: cancellations
        description: Отмены. Партиция по cancelled_date, он на 0-2 дня позже даты заказа.
        columns:
          - name: cancellation_id
            description: Идентификатор отмены. Совпадает с идентификатором заказа.
          - name: order_id
            description: Отмененный заказ.
          - name: order_date
            description: Дата исходного заказа.
          - name: cancelled_date
            description: >
              Дата отмены. Ключ партиции. У заказов последних двух дней горизонта
              строки отмены может не быть - ее время не пришло, и проверки это
              учитывают.
          - name: reason
            description: Причина отмены из источника - одна из четырех.

      - name: store_traffic
        description: Дневной трафик точек. Партиция по traffic_date. Знаменатель конверсии.
        columns:
          - name: store_id
            description: Магазин.
          - name: traffic_date
            description: Дата. Ключ партиции.
          - name: visitors
            description: >
              Посетители по дверному счетчику. Ноль означает не отсутствие людей,
              а неработающий прибор, и суждение об этом выносит флаг качества.
