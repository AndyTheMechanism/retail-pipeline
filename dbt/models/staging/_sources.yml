version: 2

sources:
  - name: raw
    schema: raw
    description: >
      The raw layer — the source export exactly as it arrives, defects included.
      There are deliberately no primary keys and no uniqueness constraints here:
      doubled rows are one of the planted defects, and a constraint would make
      that defect impossible to load. Details are in db/schema/01_raw.sql.

    # There is no source freshness block here, and that is not an oversight. The
    # built-in dbt source freshness looks at a load-timestamp column, and the
    # raw layer has none: the source hands over business dates, not a record of
    # when the row arrived. The freshness check lives in a test of its own —
    # tests/assert_source_is_fresh.sql.

    tables:
      - name: stores
        description: Store reference table. The only table without partitions, reloaded in full.
        columns:
          - name: store_id
            description: Store identifier. The same one throughout the project.
          - name: store_code
            description: Store code in the form S0001. The marts do not use it; it exists for readability.
          - name: city
            description: City. One of thirty, a reference attribute.
          - name: store_format
            description: Store format — small, medium or large. It sets the store's baseline order volume.
          - name: opened_on
            description: >
              Opening date. Before it the store has neither orders nor footfall,
              and the grain of both marts rests on it: 12 stores out of 120
              opened inside the horizon, and their empty days are not missing
              data.

      - name: orders
        description: Orders. Partitioned by order_date. The status is already set in the source.
        columns:
          - name: order_id
            description: >
              Order identifier. It encodes the date and the store, so the
              partition can be recovered from it unambiguously, and a return can
              be tied to its order without touching the orders table.
          - name: store_id
            description: The store that placed the order.
          - name: order_ts
            description: Order timestamp, hour between 9 and 21. The marts do not use it — the grain is daily.
          - name: order_date
            description: Order date. The partition key.
          - name: channel
            description: >
              Channel — offline, web or app. The door counter sees only
              offline, and that is why the channel takes part in the conversion
              calculation.
          - name: status
            description: >
              Placed or cancelled. The status is already final in the source: a
              cancellation never changes yesterday's number.
          - name: customer_id
            description: >
              Customer identifier, filled in on 70% of orders. Left as
              groundwork for cohorts; no current mart uses it.

      - name: order_items
        description: Order lines. Partitioned by order_date. This is where the export duplicates and the outliers sit.
        columns:
          - name: order_id
            description: The order the line belongs to.
          - name: order_date
            description: >
              Order date, denormalised on purpose: without it, dropping a
              partition would take a join to the orders table.
          - name: line_no
            description: Line number within the order. Together with order_id it forms the grain.
          - name: sku
            description: >
              An opaque item code. There is no category, no brand and no cost
              price here, and there will not be — that is category management,
              a different profession.
          - name: quantity
            description: Quantity. Zero does occur — that is a planted outlier.
          - name: unit_price
            description: Price per unit, from 199 to 19990.
          - name: line_amount
            description: >
              Line amount. It can be negative — that is another planted
              outlier, and it deliberately makes it all the way to the mart.

      - name: returns
        description: >
          Returns. Partitioned by returned_date rather than by the order date:
          a return arrives on its own day and changes the revenue of an earlier
          one.
        columns:
          - name: return_id
            description: Return identifier, derived from the order identifier.
          - name: order_id
            description: The order the return belongs to.
          - name: order_date
            description: Date of the original order. This is the date the sales mart attributes the return to.
          - name: line_no
            description: The order line that was returned.
          - name: returned_date
            description: >
              The date the return arrived. The partition key. It lags the order
              date by 0-30 days, median 2 days.
          - name: quantity
            description: The quantity returned, never more than was bought.
          - name: returned_amount
            description: Return amount — unit price times the quantity returned.

      - name: cancellations
        description: Cancellations. Partitioned by cancelled_date, which is 0-2 days after the order date.
        columns:
          - name: cancellation_id
            description: Cancellation identifier. It matches the order identifier.
          - name: order_id
            description: The cancelled order.
          - name: order_date
            description: Date of the original order.
          - name: cancelled_date
            description: >
              Cancellation date. The partition key. Orders from the last two
              days of the horizon may have no cancellation row yet — its time
              has not come, and the checks account for that.
          - name: reason
            description: Cancellation reason from the source — one of four.

      - name: store_traffic
        description: Daily footfall per store. Partitioned by traffic_date. The denominator of conversion.
        columns:
          - name: store_id
            description: The store.
          - name: traffic_date
            description: The date. The partition key.
          - name: visitors
            description: >
              Visitors as counted by the door counter. A zero means a dead
              device rather than an absence of people, and that judgement is
              passed by a quality flag.
