version: 2

# Ключа tests здесь нет ни у одной модели, и это не недоделка. Проверки -
# предмет этапа 3, где отдельно решается, что роняет цепочку, а что помечает
# флагом. Слой staging пока только приводит форму: типы, имена, зерно.

models:
  - name: stg_stores
    description: Справочник магазинов. Зерно - store_id.
    columns:
      - name: store_id
        description: Идентификатор магазина.
      - name: opened_on
        description: >
          Дата открытия. До нее у магазина нет ни заказов, ни трафика, и на
          этом стоит зерно витрин: 12 магазинов из 120 открылись внутри
          горизонта, и их пустые дни - не пропущенные данные.

  - name: stg_orders
    description: Шапка чека. Зерно - order_id.
    columns:
      - name: order_id
        description: Идентификатор заказа. Кодирует дату и магазин.
      - name: status
        description: Значение источника, "оформлен" или "отменен".
      - name: channel
        description: Значение источника, "офлайн", "сайт" или "приложение".
      - name: is_cancelled
        description: Признак отмены. Отмененный заказ не дает ни выручки, ни возвратов.
      - name: is_offline
        description: >
          Признак офлайн-заказа. Числитель конверсии считается только по нему -
          дверной счетчик не видит ни сайт, ни приложение.

  - name: stg_order_items
    description: >
      Позиции заказа, по одной строке на позицию. Единственное место, где
      восстанавливается зерно (order_id, line_no) после дублей выгрузки.
    columns:
      - name: order_id
        description: Заказ, к которому относится позиция.
      - name: line_no
        description: Номер позиции внутри заказа. Вместе с order_id образует зерно.
      - name: sku
        description: >
          Непрозрачный код позиции. Ни категории, ни бренда, ни закупочной цены
          здесь нет и не будет - это категорийный менеджмент, другая профессия.
      - name: line_amount
        description: >
          Сумма позиции. Может быть отрицательной: выбросы намеренно не
          отфильтрованы, их ловит гейт этапа 3.
      - name: source_copies
        description: >
          Сколько строк на эту позицию было в источнике. Единица - норма,
          больше единицы означает дубль выгрузки. Колонка делает дедупликацию
          проверяемым фактом, а не подразумеваемой.

  - name: stg_returns
    description: Возвраты. Зерно - return_id.
    columns:
      - name: order_date
        description: Дата исходного заказа. К ней возврат относится в витрине продаж.
      - name: returned_date
        description: Дата приезда возврата. По ней нарезана партиция в сыром слое.
      - name: delay_days
        description: >
          Задержка возврата в днях. Медиана 2, 90-й перцентиль 15, максимум 30.
          На этом числе будет стоять размер окна пересчета на этапе 4.

  - name: stg_cancellations
    description: >
      Отмены. Витринами не используется намеренно: статус уже есть в заказе.
      Нужна этапу 3 для проверки ссылочной целостности и согласия с
      orders.status.
    columns:
      - name: cancelled_date
        description: Дата отмены, на 0-2 дня позже даты заказа.
      - name: reason
        description: Причина отмены из источника.

  - name: stg_store_traffic
    description: Дневной трафик точек. Зерно - (store_id, traffic_date).
    columns:
      - name: visitors
        description: >
          Посетители по дверному счетчику. Ноль здесь не приводится к null:
          суждение о том, считал ли прибор, выносится в витрине конверсии,
          где рядом видны чеки.
