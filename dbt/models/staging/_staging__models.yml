version: 2

# The checks here break the chain rather than raise a flag. Everything in this
# file is an invariant: a statement that must always hold, and if it does not,
# nothing may be counted on top of it. Quality flags live not in tests but in
# the mart_store_daily_quality model.
#
# Column descriptions here are not decoration: the dictionary (DICTIONARY.md) is
# built out of them, and a column without one shows up in it as a hole.

models:
  - name: stg_stores
    description: Store reference table. Grain — store_id.
    columns:
      - name: store_id
        description: Store identifier. The same one throughout the project.
        data_tests: [unique, not_null]
      - name: store_code
        description: Store code in the form S0001. The marts do not use it; it exists for readability.
      - name: city
        description: City. One of thirty, a reference attribute.
      - name: store_format
        description: Store format — small, medium or large. It sets the store's baseline order volume.
      - name: opened_on
        description: >
          Opening date. Before it the store has neither orders nor footfall, and
          the grain of the marts rests on that: 12 stores out of 120 opened
          inside the horizon, and their empty days are not missing data.
        data_tests: [not_null]

  - name: stg_orders
    description: Order header. Grain — order_id.
    columns:
      - name: order_id
        description: Order identifier. It encodes the date and the store.
        data_tests: [unique, not_null]
      - name: store_id
        description: The store that placed the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_stores')
                field: store_id
      - name: order_ts
        description: Order timestamp. The marts do not use it — the grain is daily.
      - name: order_date
        description: Order date, the partition key in the raw layer.
        data_tests: [not_null]
      - name: channel
        description: Source value, "offline", "web" or "app".
        data_tests:
          # A new channel value is not a data failure but a change to the
          # source contract that nobody announced. Unchecked it costs
          # conversion: an unfamiliar channel would not land in offline, and
          # conversion for the store would drift downwards without a trace.
          - accepted_values:
              arguments:
                values: ["offline", "web", "app"]
      - name: status
        description: Source value, "placed" or "cancelled".
        data_tests:
          # The same goes for the status, and a mistake costs more here:
          # is_cancelled is computed by comparison against a single string, so
          # anything unfamiliar would come out as "placed" and turn into wrong
          # revenue.
          - accepted_values:
              arguments:
                values: ["placed", "cancelled"]
      - name: customer_id
        description: >
          Customer identifier, filled in on 70% of orders. Groundwork for
          cohorts; no current mart uses it.
      - name: is_cancelled
        description: Cancellation flag. A cancelled order yields neither revenue nor returns.
        data_tests: [not_null]
      - name: is_offline
        description: >
          Offline-order flag. The numerator of conversion is counted on it
          alone — the door counter sees neither the website nor the app.
        data_tests: [not_null]

  - name: stg_order_items
    description: >
      Order lines, one row per line. The single place where the
      (order_id, line_no) grain is restored after the export duplicates.
    data_tests:
      - unique_grain:
          arguments:
            columns: [order_id, line_no]
    columns:
      - name: order_id
        description: The order the line belongs to.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: order_date
        description: >
          Order date, denormalised onto the line as the partition key. The
          window functions partition by it for the sake of the query plan — see
          QUERY-PLAN.md.
      - name: line_no
        description: Line number within the order. Together with order_id it forms the grain.
        data_tests: [not_null]
      - name: sku
        description: >
          An opaque item code. There is no category, no brand and no cost price
          here, and there will not be — that is category management, a different
          profession.
        data_tests: [not_null]
      - name: quantity
        description: Quantity. Zero does occur — that is a planted outlier.
        data_tests: [not_null, not_negative]
      - name: unit_price
        description: Price per unit, from 199 to 19990.
      - name: line_amount
        description: >
          Line amount. It can be negative: the outliers are deliberately left
          unfiltered, and the sign is not checked here — they are caught by a
          flag, not by a gate.
        data_tests: [not_null]
      - name: source_copies
        description: >
          How many rows the source held for this line. One is normal, more than
          one means an export duplicate. The column turns deduplication into a
          checkable fact rather than an assumption.
        data_tests: [not_null]

  - name: stg_returns
    description: Returns. Grain — return_id.
    columns:
      - name: return_id
        description: Return identifier, derived from the order identifier.
        data_tests: [unique, not_null]
      - name: order_id
        description: The order the return belongs to.
        data_tests:
          # A return without an order breaks net revenue: an amount is
          # subtracted, and what it is subtracted from is unknown. That is a
          # stop, not a flag.
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: order_date
        description: Date of the original order. This is the date the sales mart attributes the return to.
        data_tests: [not_null]
      - name: line_no
        description: The order line that was returned.
      - name: returned_date
        description: The date the return arrived. The raw layer is partitioned on it.
        data_tests: [not_null]
      - name: quantity
        description: The quantity returned, never more than was bought.
      - name: returned_amount
        description: Return amount. This is what gets subtracted from the revenue of the purchase day.
      - name: delay_days
        description: >
          Return delay in days. Median 2, 95th percentile 19, 99th 28, maximum
          30. The size of the reprocessing window rests on this number.
        data_tests:
          # A negative delay would mean a return arriving before the purchase.
          - not_null
          - not_negative

  - name: stg_cancellations
    description: >
      Cancellations. Deliberately unused by the marts: the status is already on
      the order. It is here to check referential integrity and agreement with
      orders.status.
    columns:
      - name: cancellation_id
        description: Cancellation identifier. It matches the order identifier.
        data_tests: [unique, not_null]
      - name: order_id
        description: The cancelled order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: order_date
        description: Date of the original order.
      - name: cancelled_date
        description: Cancellation date, 0-2 days after the order date.
        data_tests: [not_null]
      - name: reason
        description: Cancellation reason from the source — one of four.
        data_tests: [not_null]

  - name: stg_store_traffic
    description: Daily footfall per store. Grain — (store_id, traffic_date).
    data_tests:
      - unique_grain:
          arguments:
            columns: [store_id, traffic_date]
    columns:
      - name: store_id
        description: The store.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_stores')
                field: store_id
      - name: traffic_date
        description: The date the footfall was observed.
        data_tests: [not_null]
      - name: visitors
        description: >
          Visitors as counted by the door counter. A zero is not coerced to null
          here and is not treated as an error: whether the device was counting
          at all is judged by a quality flag, which shows the order count right
          beside it.
        data_tests: [not_null, not_negative]
