version: 2

# The most important stop in the whole project sits here — the reconciliation of
# the assembled order against the raw layer. It is pulled out into a test of its
# own, tests/assert_order_lines_match_raw.sql, because it goes to the source
# directly, bypassing staging: a check built on the very models it checks would
# repeat their mistake.

models:
  - name: int_order_lines
    description: >
      An order line together with its header. Grain — (order_id, line_no).
      Incremental: a run touches exactly the target date, and that decision
      rests on a measurement of the query plan — see QUERY-PLAN.md.
    data_tests:
      - unique_grain:
          arguments:
            columns: [order_id, line_no]
    columns:
      - name: order_id
        description: The order the line belongs to.
      - name: line_no
        description: Line number within the order. Together with order_id it forms the grain.
      - name: order_date
        description: >
          The date from the line, not from the header: in the raw layer it is
          the partition key, and even an orphaned row carries it. Agreeing with
          the header date is an invariant, and it is checked by a test rather
          than forced by a join. The reprocessing window is cut on this same
          column, and the index sits on it.
        data_tests: [not_null]
      - name: store_id
        description: >
          The store from the order header. The join is deliberately a left one
          so that a line without an order does not vanish before it is checked —
          and this is that check. A null here means an orphaned line, and no
          revenue may be counted on it.
        data_tests: [not_null]
      - name: channel
        description: The order's channel from the header. The sales mart does not use it; it is there for investigations.
      - name: is_cancelled
        description: Cancellation flag from the header. Cancelled orders yield no revenue.
        data_tests: [not_null]
      - name: is_offline
        description: Offline-order flag from the header.
      - name: sku
        description: An opaque item code. It does not travel beyond this model.
      - name: quantity
        description: Quantity. Zero does occur — a planted outlier.
        data_tests: [not_null, not_negative]
      - name: unit_price
        description: Price per unit.
      - name: line_amount
        description: Line amount. Negative values are deliberately left unfiltered.
        data_tests: [not_null]
      - name: source_copies
        description: How many rows the source held for this line before deduplication.

  - name: int_returns_attributed
    description: >
      A return tied to a store through its order. Grain — return_id. The model
      is required rather than decorative: returns in the raw layer carry no
      store_id.
    columns:
      - name: return_id
        description: Return identifier.
        data_tests: [unique, not_null]
      - name: order_id
        description: The order the return belongs to.
      - name: line_no
        description: The order line that was returned.
      - name: store_id
        description: >
          The store taken from the order. A null means an orphaned return: the
          amount would be subtracted from the revenue of no store in
          particular.
        data_tests: [not_null]
      - name: is_cancelled
        description: >
          Cancellation flag of the original order. A return against a cancelled
          order makes no sense — a test of its own,
          assert_returns_belong_to_live_orders, checks that.
        data_tests: [not_null]
      - name: order_date
        description: Date of the original order. This is the date the sales mart attributes the return to.
        data_tests: [not_null]
      - name: returned_date
        description: The date the return arrived. It shows where a change to yesterday's number came from.
        data_tests: [not_null]
      - name: delay_days
        description: Return delay in days. The input for the size of the reprocessing window and for the flag.
        data_tests: [not_null, not_negative]
      - name: quantity
        description: The quantity returned.
      - name: returned_amount
        description: Return amount.

  - name: int_store_day_spine
    description: >
      A dense store-by-day grid starting from each store's opening date. Grain —
      (store_id, calendar_date), exactly 62,690 rows. The grain of both marts.
    data_tests:
      - unique_grain:
          arguments:
            columns: [store_id, calendar_date]
    columns:
      - name: store_id
        description: The store. All 120 of them are present in the grid.
        data_tests: [not_null]
      - name: calendar_date
        description: >
          A day of the horizon. The horizon is computed from the observed data
          rather than taken as a constant: a constant would drift away from the
          generator silently.
        data_tests: [not_null]
