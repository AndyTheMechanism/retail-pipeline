version: 2

# Tests on the marts work differently from the ones higher up the graph, and
# that is worth knowing.
#
# A dbt test runs after its model has been built. So a test on a mart fails once
# the wrong mart is already in the database — by the design of the tool it
# cannot stop that mart from appearing. Everything that has to keep a broken
# number out of a mart therefore sits higher up: the reconciliation against the
# raw layer and referential integrity live on the intermediate layer, and a test
# failing there simply does not let the marts be built.
#
# What is left here are shape checks — the grain and the keys. They are cheap,
# and their failure means not "the mart cannot be published" but "the mart is
# broken, and it needs looking at now".

models:
  - name: mart_store_daily_sales
    description: >
      Sales per store and day. Grain — (store_id, order_date), 62,690 rows
      along the spine. A return is attributed to the order date, so yesterday's
      number can change — and that is the subject of the project.
    data_tests:
      - unique_grain:
          arguments:
            columns: [store_id, order_date]
    columns:
      - name: store_id
        description: The store. Part of the grain.
        data_tests: [not_null]
      - name: order_date
        description: >
          The day of purchase. Part of the grain. Returns are attributed to it
          rather than to the day they arrive, which is why the row can be
          rewritten later.
        data_tests: [not_null]
      - name: has_orders
        description: >
          Whether orders arrived for this day. For an open store that is the
          norm; false across the whole network on one day means a partition that
          did not arrive.
        data_tests: [not_null]
      - name: orders_count
        description: Orders excluding cancelled ones, counted by header rather than by line.
      - name: orders_cancelled_count
        description: >
          Cancelled orders. Kept apart rather than thrown away: a day where half
          the orders were cancelled has to look different from a day with no
          orders at all.
      - name: lines_count
        description: Lines in non-cancelled orders, already deduplicated.
      - name: units_sold
        description: Units sold in non-cancelled orders.
      - name: revenue_gross
        description: >
          Revenue over non-cancelled orders. Null if the data for the day did
          not arrive — a zero is written only where there was something to
          count.
      - name: returns_amount
        description: >
          Returns attributed to the order date. These are what move yesterday's
          number, and the reprocessing window exists for them.
      - name: returns_arrived_amount
        description: >
          Returns that arrived on this day against orders of any date. It takes
          no part in revenue; it is here so you can see where a change to the
          past came from.
        data_tests: [not_null, not_negative]
      - name: revenue_net
        description: Revenue less the returns attributed to the order date.

  - name: mart_store_daily_conversion
    description: >
      Conversion per store and day. Grain — (store_id, traffic_date), the same
      62,690 rows. This mart has no reprocessing window: neither footfall nor
      orders are rewritten after the fact.
    data_tests:
      - unique_grain:
          arguments:
            columns: [store_id, traffic_date]
    columns:
      - name: store_id
        description: The store. Part of the grain.
        data_tests: [not_null]
      - name: traffic_date
        description: The day of observation. Part of the grain.
        data_tests: [not_null]
      - name: has_traffic
        description: Whether footfall arrived for this day. False means a partition that did not arrive.
        data_tests: [not_null]
      - name: has_orders
        description: Whether orders arrived for this day.
      - name: visitors
        description: Visitors as counted by the door counter. Null if no footfall arrived for the day.
        data_tests: [not_negative]
      - name: orders_offline
        description: >
          The numerator of conversion: offline orders excluding cancelled ones.
          Web and app are left out — the door counter does not see them.
        data_tests: [not_negative]
      - name: conversion
        description: >
          Orders per visitor. Null when there is no footfall, no orders, or the
          visitor count is zero: zero visitors alongside real orders is a
          message about a broken device, not a value. The quality threshold is
          not applied here — that judgement is passed by a flag.

  - name: mart_store_daily_sales_trend
    description: >
      A weekly revenue baseline on top of the sales mart. A model of its own,
      because a rolling window pulls in neighbouring rows while the sales mart
      is incremental.
    data_tests:
      - unique_grain:
          arguments:
            columns: [store_id, order_date]
    columns:
      - name: store_id
        description: The store. Part of the grain.
        data_tests: [not_null]
      - name: order_date
        description: The day of purchase. Part of the grain.
        data_tests: [not_null]
      - name: revenue_net
        description: Net revenue for the day, carried over from the sales mart for ease of reading.
      - name: revenue_net_avg_7d
        description: >
          A 7-day rolling average of net revenue. Empty if the window contains a
          day without data: avg would skip the null and divide by fewer days,
          which is to say it would replace a gap with an estimate.

  - name: mart_store_daily_quality
    description: >
      Quality flags: what cannot be counted for this store on this day. Grain —
      (store_id, flag_date, check_name). A table of its own rather than columns
      on the marts: a row can carry several flags, and more get added over
      time — as rows that grows naturally, as columns it does not.
    data_tests:
      - unique_grain:
          arguments:
            columns: [store_id, flag_date, check_name]
    columns:
      - name: store_id
        description: The store the flag belongs to.
        data_tests: [not_null]
      - name: flag_date
        description: The day the flag belongs to. Part of the grain.
        data_tests: [not_null]
      - name: check_name
        description: >
          The name of the check. Machine-readable, because this is the column
          people filter and join on. The list is closed: a new flag is added
          deliberately, together with an edit to this test, rather than arriving
          as a typo.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - conversion_above_threshold
                  - return_outside_window
                  - orders_partition_missing
                  - traffic_partition_missing
      - name: reason
        description: The reason in prose — a human reads it in a report, not a machine.
        data_tests: [not_null]
      - name: measured_value
        description: The number that made the flag fire.
      - name: threshold_value
        description: The threshold it was compared against. Empty where there was no comparison.

  - name: mart_store_daily_revisions
    description: >
      The revision log: which published number changed, when and why. The core
      of the project. A row appears only for the store-and-day pair whose number
      actually moved; the first version does not count as a revision. A view
      over the ops.snap_store_daily_sales snapshot.
    data_tests:
      - unique_grain:
          arguments:
            columns: [store_id, order_date, version_no]
    columns:
      - name: store_id
        description: The store whose number was recomputed.
        data_tests: [not_null]
      - name: order_date
        description: The day whose number changed, not the day of the recomputation.
        data_tests: [not_null]
      - name: revised_at
        description: When the recomputation made that change.
        data_tests: [not_null]
      - name: version_no
        description: >
          The version number of the value. Always greater than one: the first
          version is not a change but the first appearance of the number.
        data_tests: [not_null]
      - name: revenue_net_was
        description: What was published before the recomputation.
      - name: revenue_net_became
        description: What was published after it.
      - name: revenue_net_delta
        description: How far it moved. Negative means the number went down.
      - name: returns_amount_was
        description: Returns attributed to this day, before the recomputation.
      - name: returns_amount_became
        description: The same after it. The difference from the previous column is usually the whole revision.
      - name: reason
        description: >
          The reason is not guessed but derived from which quantities diverged.
          Returns changed while gross stayed put — a late return, ordinary life
          in this domain. Gross changed — the raw layer was rebuilt, and that
          one is worth looking into.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - late return
                  - raw layer rebuilt
                  - order mix changed
                  - other
