# Профиль лежит в репозитории намеренно.
#
# Обычно profiles.yml держат в ~/.dbt и не коммитят - потому что там пароли от
# боевого хранилища. Здесь хранилище одно: локальный контейнер, который слушает
# только 127.0.0.1, и пароль в нем тривиальный по той же причине, по которой он
# тривиален в docker-compose.yml, - чтобы проект заводился без настройки.
#
# Секретов тут нет и появиться неоткуда: все значения читаются из окружения, а
# умолчания совпадают с docker-compose.yml и Makefile. Если база не локальная -
# переменные окружения перебивают, файл править не надо.
#
# Makefile выставляет DBT_PROFILES_DIR на этот каталог. Без него dbt пошел бы
# искать профиль в ~/.dbt и нашел бы там чужой, от другого проекта.

retail_pipeline:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', '127.0.0.1') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'pipeline') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'pipeline') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'warehouse') }}"
      # Запасная схема: сюда попадет модель, у которой не объявлена своя.
      # Реально своя есть у каждой папки - см. macros/generate_schema_name.sql.
      schema: analytics
      threads: 4
