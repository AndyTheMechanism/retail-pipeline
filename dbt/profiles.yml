# The profile sits in the repository on purpose.
#
# Normally profiles.yml is kept in ~/.dbt and never committed — because it holds
# the passwords to a production warehouse. Here there is one warehouse: a local
# container listening on 127.0.0.1 only, and the password in it is trivial for
# the same reason it is trivial in docker-compose.yml — so that the project
# starts with no configuration.
#
# There are no secrets here and nowhere for them to come from: every value is
# read from the environment, and the defaults match docker-compose.yml and the
# Makefile. If the database is not local, environment variables override the
# defaults and the file needs no editing.
#
# The Makefile points DBT_PROFILES_DIR at this directory. Without it dbt would
# go looking for a profile in ~/.dbt and find someone else's, left over from
# another project.

retail_pipeline:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', '127.0.0.1') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'pipeline') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'pipeline') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'warehouse') }}"
      # Fallback schema: a model with no schema of its own would land here.
      # Every directory does declare one — see macros/generate_schema_name.sql.
      schema: analytics
      threads: 4
