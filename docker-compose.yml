# One service — Postgres. Airflow is installed locally in a venv; there is no
# container for it.
#
# The official Airflow compose file is deliberately not used: eight services
# and more than two hundred lines, which cannot be explained in a minute, and
# being explainable is a requirement here, not a nice-to-have.

services:
  postgres:
    # The image name is the full one rather than the short one: rootless podman
    # asks which registry to pull a short name from, and a non-interactive
    # `make up` stalls on that question.
    image: docker.io/library/postgres:16
    container_name: retail-pipeline-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pipeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipeline}
      POSTGRES_DB: warehouse
    ports:
      # Listen on localhost only. The default password is trivial — and it has
      # to be, so the project starts with no configuration — but then the
      # database must not be exposed to somebody else's Wi-Fi.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # :Z is the SELinux label. Without it the container on Fedora cannot read
      # the init directory, and the error looks like "the database is empty".
      - ./db/init:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      # -h 127.0.0.1 is mandatory. While the init scripts are running, Postgres
      # brings up a temporary server on a unix socket alone, with no TCP. A
      # check through the socket counts it as ready, after which the server goes
      # off to restart — and the very next command gets "the database system is
      # shutting down". The temporary server does not answer over TCP, which
      # makes readiness honest.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-pipeline} -d warehouse"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
